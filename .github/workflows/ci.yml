name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  ci:
    name: Typecheck · Lint · Build · Test
    runs-on: ubuntu-latest

    strategy:
      matrix:
        # Pin to the LTS version declared in package.json engines.
        # Local dev uses Node 26; CI uses Node 20 LTS to catch any
        # accidental reliance on cutting-edge V8 behaviour.
        node-version: [20.x]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
        env:
          NODE_ENV: production

      - name: Test
        run: npm test
        env:
          NODE_ENV: test
          # Use a throwaway DB for CI — never touch the production file
          SQLITE_PATH: ":memory-ci:"
